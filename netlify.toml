[build]
  command = "npm run build"
  publish = "dist/gridpulse/browser"

[build.environment]
  NODE_VERSION = "22.23.4"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/maplibre-gl-worker.mjs"
  [headers.values]
    Content-Type = "text/javascript"
